<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar B-IA | Dashboard Benchmarking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col selection:bg-blue-600 selection:text-white">

    <header class="border-b border-slate-200 bg-white/90 backdrop-blur sticky top-0 z-50 shadow-sm">
        <div class="max-w-[95rem] mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20 font-black text-xl">
                    <i class="fa-solid fa-table-columns"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-base sm:text-lg text-slate-900 tracking-tight">MATRIZ COMPARATIVA B-IA</h1>
                    <p class="text-xs text-slate-500">Benchmarking de Competencia Perú (6 Operadores Core)</p>
                </div>
            </div>
            
            <div class="hidden sm:flex items-center gap-2 bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-lg">
                <span class="relative flex h-2.5 w-2.5">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                </span>
                <span class="text-xs font-bold text-emerald-700 uppercase tracking-wide">Conexión Segura Activa</span>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-[95rem] w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="bg-white border border-slate-200/80 rounded-2xl overflow-hidden shadow-lg shadow-slate-200/50 flex flex-col h-[80vh]">
            
            <div class="p-4 bg-slate-50/80 border-b border-slate-200 flex justify-between items-center">
                <h2 class="font-extrabold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-code-compare text-blue-600"></i>
                    <span>Datos en Vivo - Base de Datos Central</span>
                </h2>
                <span class="text-xs font-bold bg-blue-50 text-blue-700 px-3 py-1 rounded-lg border border-blue-200">
                    Sincronización Directa
                </span>
            </div>

            <div class="flex-1 w-full relative">
                <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSqEST1wyo3laknHkhAJmT5RLyJpRDEpn79kZKGaN7phS7PrgcOA_npapCd4tf1VTlz4jbb-qhCwivM/pubhtml?gid=1338585401&single=true&widget=true&headers=false" class="absolute top-0 left-0 w-full h-full border-none"></iframe>
            </div>
            
        </div>
    </main>

</body>
</html>
